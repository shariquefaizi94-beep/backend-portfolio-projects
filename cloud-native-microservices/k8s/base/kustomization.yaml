# Kustomize base configuration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: cloud-native-microservices

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - hpa.yaml
  - serviceaccount.yaml
  - pdb.yaml
  - istio-virtualservice.yaml

commonLabels:
  app.kubernetes.io/name: cloud-native-microservices
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: portfolio

images:
  - name: cloud-native-microservices
    newName: cloud-native-microservices
    newTag: latest
