# ServiceAccount for Cloud Native Microservices
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-native-microservices
  labels:
    app: cloud-native-microservices
---
# Role for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-native-microservices
  labels:
    app: cloud-native-microservices
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-native-microservices
  labels:
    app: cloud-native-microservices
subjects:
  - kind: ServiceAccount
    name: cloud-native-microservices
roleRef:
  kind: Role
  name: cloud-native-microservices
  apiGroup: rbac.authorization.k8s.io
