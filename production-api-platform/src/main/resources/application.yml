spring:
  application:
    name: production-api-platform
  
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      printer:
        enabled: true

  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

# Logging configuration
logging:
  level:
    root: INFO
    com.portfolio.api: DEBUG
    org.springframework.graphql: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# JWT Configuration
jwt:
  secret: mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong
  expiration-hours: 24

# Rate limiting defaults
ratelimit:
  enabled: true
  default-tier: FREE

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
