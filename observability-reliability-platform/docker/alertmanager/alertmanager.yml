# Alertmanager Configuration
global:
  resolve_timeout: 5m

# Route tree
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-receiver'
      group_wait: 10s
      repeat_interval: 1h
    
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-receiver'
      group_wait: 1m
      repeat_interval: 4h
    
    # Info alerts - lower priority
    - match:
        severity: info
      receiver: 'default-receiver'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules
inhibit_rules:
  # Inhibit warning alerts if critical alert exists for same alertname
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

# Receivers
receivers:
  - name: 'default-receiver'
    # Placeholder for webhook/email/slack integration
    # In production, configure actual notification channels
    webhook_configs:
      - url: 'http://observability-platform:8080/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-receiver'
    # Configure for critical alerts
    webhook_configs:
      - url: 'http://observability-platform:8080/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'warning-receiver'
    # Configure for warning alerts
    webhook_configs:
      - url: 'http://observability-platform:8080/api/v1/alerts/webhook'
        send_resolved: true

# Templates
templates: []
