global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Event Producer metrics
  - job_name: 'event-producer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['event-producer:8081']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'event-producer'

  # Stream Processor metrics
  - job_name: 'stream-processor'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['stream-processor:8082']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'stream-processor'

  # Analytics API metrics
  - job_name: 'analytics-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['analytics-api:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'analytics-api'
