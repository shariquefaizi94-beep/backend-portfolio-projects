server:
  port: 8092
spring:
  application:
    name: stream-processor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

kafka:
  topics:
    click-events: analytics.click-events

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://localhost:9200}
  events-index: click-events
  metrics-index: aggregated-metrics

aggregation:
  window-size-seconds: 60
  flush-interval-ms: 60000

deduplication:
  ttl-seconds: 3600

processor:
  index-raw-events: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.nexaforge.processor: INFO
