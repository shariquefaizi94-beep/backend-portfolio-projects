name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean verify -B

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs
        run: ./mvnw clean package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Event Producer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.event-producer
          push: false
          tags: event-producer:${{ github.sha }}

      - name: Build Stream Processor image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.stream-processor
          push: false
          tags: stream-processor:${{ github.sha }}

      - name: Build Analytics API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.analytics-api
          push: false
          tags: analytics-api:${{ github.sha }}
